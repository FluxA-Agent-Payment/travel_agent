<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
.fd { position:absolute; inset:0; background:#16150f; color:#efece4;
            font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
            overflow:hidden; }
      .fd .mono { font-family:ui-monospace,monospace; }
      .fd .plate-wrap { position:absolute; inset:0; overflow:hidden;
                       /* The source is 1320x1080 (1.22:1) in a 16:9 frame.
                          `cover` cropped 45% of the height and took the
                          masthead with it. `contain` + this scale maps the
                          application window itself to the full frame height,
                          losing none of the UI; the dark margins left and
                          right are the app's own ground, not letterbox. */
                       transform: scale(1.227); }
      .fd .plate { position:absolute; inset:0; width:1920px; height:1080px;
                   object-fit:contain; background:#16150f; }
      .fd .kicker { font-family:ui-monospace,monospace; font-size:22px;
                    letter-spacing:.18em; text-transform:uppercase; color:#6fc3a4; }
      .fd .lede { font-size:64px; font-weight:640; letter-spacing:-.02em; line-height:1.12; }
      .fd .sub { font-size:30px; color:#a29d90; line-height:1.45; }
      .fd .lower { position:absolute; left:96px; bottom:96px; max-width:1240px;
                   padding:26px 32px; border:1px solid rgba(239,236,228,.14);
                   background:rgba(30,29,23,.94); border-radius:10px; }
      .fd .lower-t { font-size:34px; font-weight:600; line-height:1.28; }
      .fd .rule { height:1px; background:rgba(239,236,228,.14); }
      </style>
      <div id="mandate" data-composition-id="mandate" data-width="1920" data-height="1080"
           style="position:relative;width:1920px;height:1080px;background:#16150f">

        <div class="fd">
          <div class="plate-wrap" data-layout-allow-overflow><video id="mandate-plate" class="plate" src="assets/placeholder-run.mp4"
                 data-start="0" data-duration="20" data-media-start="128" muted playsinline></video></div>
          <div class="lower" id="mandate-c0" style="opacity:0">
            <div class="kicker">Why a signature</div>
            <div class="lower-t" style="margin-top:10px">This fare takes no card. It settles from an agency deposit.</div>
          </div>
          <div class="lower" id="mandate-c1" style="opacity:0">
            <div class="kicker">FluxA mandate</div>
            <div class="lower-t" style="margin-top:10px">The agent cannot pass this.</div>
          </div>
          <div class="lower" id="mandate-c2" style="opacity:0">
            <div class="kicker">Sandbox</div>
            <div class="lower-t" style="margin-top:10px">Deduction simulated &mdash; no money moves.</div>
          </div>
          <div class="lower" id="mandate-c3" style="opacity:0">
            <div class="kicker">Resumed</div>
            <div class="lower-t" style="margin-top:10px">The agent picks the task back up on its own.</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#mandate-c0", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: .5, ease: "power3.out" }, 0.5);
          tl.to("#mandate-c0", { autoAlpha: 0, duration: .35 }, 5.0);
          tl.fromTo("#mandate-c1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: .5, ease: "power3.out" }, 5.5);
          tl.to("#mandate-c1", { autoAlpha: 0, duration: .35 }, 11.5);
          tl.fromTo("#mandate-c2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: .5, ease: "power3.out" }, 12.0);
          tl.to("#mandate-c2", { autoAlpha: 0, duration: .35 }, 15.5);
          tl.fromTo("#mandate-c3", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: .5, ease: "power3.out" }, 16.0);
          tl.to("#mandate-c3", { autoAlpha: 0, duration: .35 }, 19.4);

          window.__timelines["mandate"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
