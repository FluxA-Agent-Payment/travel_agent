<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1280px; height:720px; overflow:hidden; background:#0a0a0a; }
      body { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }

      /* Channel look: near-black ground, one lime accent, a soft green bloom
         behind the headline, wordmark top-left, terminal plate on the right. */
      #root { position:relative; background:#0a0a0a; color:#fff; }
      .bloom { position:absolute; width:900px; height:620px; left:-180px; top:-190px;
               background:radial-gradient(closest-side, rgba(150,230,60,.20), rgba(150,230,60,0) 70%); }
      .bloom.b2 { left:520px; top:300px; width:760px; height:520px;
                  background:radial-gradient(closest-side, rgba(150,230,60,.10), rgba(150,230,60,0) 70%); }

      /* the supplied white wordmark, 649x161 (4.03:1) */
      .mark { position:absolute; left:44px; top:34px; width:150px; height:37px; }

      .copy { position:absolute; left:46px; top:232px; width:770px; }
      .l1 { font-size:54px; font-weight:800; letter-spacing:-.03em; line-height:1.06; }
      .l2 { font-size:54px; font-weight:800; font-style:italic; letter-spacing:-.03em;
            line-height:1.06; color:#b6f24a; margin-top:4px; }
      .sub { font-size:23px; color:#c9c9c4; margin-top:26px; line-height:1.4; font-weight:500; }

      .chip { display:inline-flex; align-items:center; gap:9px; margin-top:34px;
              background:#161616; border:1px solid #2a2a2a; border-radius:8px;
              padding:10px 16px; font-family:ui-monospace,monospace; font-size:18px;
              color:#b6f24a; }
      .chip i { width:9px; height:17px; background:#b6f24a; display:inline-block; }

      .term { position:absolute; right:44px; top:214px; width:470px;
              background:#101210; border:1px solid #23261f; border-radius:12px;
              padding:18px 20px 20px; font-family:ui-monospace,monospace; font-size:16px;
              line-height:1.85; }
      .term .bar { display:flex; align-items:center; gap:7px; margin-bottom:14px; }
      .term .dot { width:9px; height:9px; border-radius:50%; background:#2f332a; }
      .term .tag { margin-left:auto; font-size:12px; letter-spacing:.16em; color:#8b9180; }
      .term .c { color:#8b9180; }
      .term .g { color:#b6f24a; }
      .term .w { color:#e8e8e2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="thumb" data-start="0" data-duration="1"
         data-width="1280" data-height="720">
      <div class="bloom"></div>
      <div class="bloom b2"></div>

      <img class="mark" src="assets/fluxa-logo-white.png" alt="FluxA" />

      <div class="copy">
        <div class="l1">Your agent books flights.</div>
        <div class="l2">You approve the spend.</div>
        <div class="sub">Real fares on Atlas, paid from your FluxA wallet.</div>
        <div class="chip">$ fluxa flight desk <i></i></div>
      </div>

      <div class="term">
        <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="tag">AGENT &middot; LIVE</span></div>
        <div class="c"># two days, $200, sunrise</div>
        <div class="w">&gt; search HKG &rarr; TPE <span class="g">3 fares</span></div>
        <div class="w">&gt; verify <span class="g">107.06 held &check;</span></div>
        <div class="w">&gt; draft <span class="c">nothing booked</span></div>
        <div class="w">&gt; mandate <span class="g">107.06 USDC</span></div>
        <div class="g">&plus; approved by you &check;</div>
        <div class="w">&gt; ticketed <span class="g">S72564 &check;</span></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["thumb"] = tl;
    </script>
  </body>
</html>
